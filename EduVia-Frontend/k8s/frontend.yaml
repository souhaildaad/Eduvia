apiVersion: apps/v1
kind: Deployment
metadata:
  name: eduvia-frontend
  namespace: eduvia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eduvia-frontend
  template:
    metadata:
      labels:
        app: eduvia-frontend
    spec:
      containers:
        - name: frontend
          image: mayarahachanipi/eduvia-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: eduvia-frontend
  namespace: eduvia
spec:
  selector:
    app: eduvia-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: LoadBalancer
