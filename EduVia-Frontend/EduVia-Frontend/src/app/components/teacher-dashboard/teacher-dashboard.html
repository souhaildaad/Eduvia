<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Tableau de Bord Enseignant</h1>
    <button mat-raised-button color="warn" (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      Déconnexion
    </button>
  </header>

  <mat-tab-group>
    <mat-tab label="Gestion du Contenu">
      <app-content-management></app-content-management>
    </mat-tab>
    <mat-tab label="Rappels d'Examens">
      <app-exam-reminders></app-exam-reminders>
    </mat-tab>
    <mat-tab label="Suivi des Étudiants">
      <app-student-tracking></app-student-tracking>
    </mat-tab>
  </mat-tab-group>
</div>
