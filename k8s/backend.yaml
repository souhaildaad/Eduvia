apiVersion: apps/v1
kind: Deployment
metadata:
  name: eduvia-backend
  namespace: eduvia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eduvia-backend
  template:
    metadata:
      labels:
        app: eduvia-backend
    spec:
      containers:
        - name: backend
          image: mayarahachanipi/eduvia-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: MEDIA_ROOT
              value: /data/uploads
            - name: MONGODB_NAME
              value: eduvia
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: eduvia-backend-secrets
                  key: mongodb-uri
            - name: FRONTEND_URL
              value: http://eduvia-frontend
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eduvia-backend-secrets
                  key: django-secret-key
          volumeMounts:
            - name: django-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health/
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: django-data
          persistentVolumeClaim:
            claimName: eduvia-django-data
---
apiVersion: v1
kind: Service
metadata:
  name: eduvia-backend
  namespace: eduvia
spec:
  selector:
    app: eduvia-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eduvia-django-data
  namespace: eduvia
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
