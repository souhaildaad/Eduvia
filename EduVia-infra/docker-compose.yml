services:

  frontend:
    build: ../EduVia-Frontend
    container_name: eduvia-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ../EduVia django
    container_name: eduvia-backend
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - eduvia-backend
    env_file:
      - ../EduVia django/.env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret-change-me}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,eduvia-backend,host.docker.internal,*
      FRONTEND_URL: http://localhost:4200
      BACKEND_URL: http://localhost:3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017}
      MONGODB_NAME: ${MONGODB_NAME:-eduvia}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - django_uploads:/app/uploads
    command: sh -c "mkdir -p /app/uploads && cp -an /app/seed_uploads/. /app/uploads/ 2>/dev/null || true; python manage.py migrate --noinput && gunicorn EduVia.wsgi:application --bind 0.0.0.0:3000 --workers 3 --timeout 120"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: eduvia-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mongo_data:
  django_uploads:
